spring.application.name=walletapi
spring.h2.console.enabled=true
# Use PostgreSQL datasource for local/production
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=seeni123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator management endpoints
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers,threaddump,httptrace
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

server.port=8088

# Ensure Hibernate generates the schema before Spring runs data.sql
spring.jpa.defer-datasource-initialization=true
