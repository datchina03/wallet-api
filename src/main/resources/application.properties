spring.application.name=walletapi
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator management endpoints
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers,threaddump,httptrace
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

server.port=8088

# Ensure Hibernate generates the schema before Spring runs data.sql
spring.jpa.defer-datasource-initialization=true
